<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vipro Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app">
        <header>
            <div class="header-left">
                <input type="file" id="importFile" accept=".json" onchange="importData(event)" hidden>
                <button class="menu-toggle" id="menuToggle" onclick="toggleMenu()" title="Menu">
                    <span class="menu-bar"></span>
                    <span class="menu-bar"></span>
                    <span class="menu-bar"></span>
                    <span class="sync-dot" id="syncDot"></span>
                </button>
            </div>
            <div class="logo">
                <span class="logo-text">Vipro Time</span>
            </div>

            <!-- Slide-out Menu -->
            <div class="slide-menu" id="slideMenu">
                <div class="slide-menu-header">
                    <span class="slide-menu-title">Menu</span>
                    <button class="menu-close-btn" onclick="toggleMenu()">×</button>
                </div>
                <div class="slide-menu-content">
                    <div class="menu-section">
                        <span class="menu-section-label">Data</span>
                        <button class="menu-item" onclick="exportData(); toggleMenu();">
                            <span class="menu-item-icon">↓</span>
                            <span class="menu-item-text">Export Backup</span>
                        </button>
                        <button class="menu-item" onclick="document.getElementById('importFile').click(); toggleMenu();">
                            <span class="menu-item-icon">↑</span>
                            <span class="menu-item-text">Import Backup</span>
                        </button>
                    </div>
                    <div class="menu-section">
                        <span class="menu-section-label">Account</span>
                        <div class="menu-sync-status" id="menuSyncStatus">
                            <span class="sync-indicator" id="syncIndicator"></span>
                            <span class="sync-text" id="syncText">Not signed in</span>
                        </div>
                        <button class="menu-item" id="menuAuthBtn" onclick="handleMenuAuth()">
                            <span class="menu-item-icon">⚡</span>
                            <span class="menu-item-text" id="menuAuthText">Sign in to sync</span>
                        </button>
                        <button class="menu-item menu-signout" id="menuSignOut" onclick="signOut(); toggleMenu();" style="display: none;">
                            <span class="menu-item-icon">→</span>
                            <span class="menu-item-text">Sign Out</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="slide-menu-overlay" id="slideMenuOverlay" onclick="toggleMenu()"></div>
            <div class="hours-badge" id="hoursLeft">
                <span class="hours-num">24</span>
                <span class="hours-label">hrs free</span>
            </div>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="timetable" onclick="switchTab('timetable')">
                <span class="tab-icon">📅</span>
                <span class="tab-label">Timetable</span>
            </button>
            <button class="tab-btn" data-tab="todo" onclick="switchTab('todo')">
                <span class="tab-icon">☑</span>
                <span class="tab-label">Todo</span>
            </button>
        </nav>

        <!-- TIMETABLE TAB -->
        <div id="timetable-tab" class="tab-content">
            <nav class="template-nav">
                <div class="template-selector">
                    <button class="nav-btn" onclick="prevTemplate()">←</button>
                    <div class="template-info" onclick="showTemplateMenu()">
                        <span class="template-name" id="templateName">My Schedule</span>
                        <span class="template-hint">tap to switch</span>
                    </div>
                    <button class="nav-btn" onclick="nextTemplate()">→</button>
                </div>
            </nav>

            <div class="template-menu" id="templateMenu">
                <div class="template-menu-header">
                    <span>My Schedules</span>
                    <button class="menu-close-btn" onclick="hideTemplateMenu()">×</button>
                </div>
                <div class="template-list" id="templateList"></div>
                <div class="template-menu-footer">
                    <input type="text" id="newTemplateName" placeholder="New schedule name..." class="template-input">
                    <button class="add-template-btn" onclick="createTemplate()">+</button>
                </div>
            </div>
            <div class="template-overlay" id="templateOverlay" onclick="hideTemplateMenu()"></div>

            <main>
                <section class="add-card">
                    <div class="add-header">
                        <span class="section-title">Add Task</span>
                    </div>

                    <div class="add-body">
                        <div class="time-row">
                            <div class="time-group">
                                <input type="time" id="startTime" value="09:00">
                            </div>
                            <span class="time-divider">→</span>
                            <div class="time-group">
                                <input type="time" id="endTime" value="10:00">
                            </div>
                        </div>

                        <input
                            type="text"
                            class="task-input"
                            id="taskInput"
                            placeholder="What's on your schedule?"
                        >

                        <div class="add-footer">
                            <div class="color-options">
                                <button class="color-btn active" data-color="coral" onclick="selectColor('coral')"></button>
                                <button class="color-btn" data-color="sky" onclick="selectColor('sky')"></button>
                                <button class="color-btn" data-color="mint" onclick="selectColor('mint')"></button>
                                <button class="color-btn" data-color="sand" onclick="selectColor('sand')"></button>
                                <button class="color-btn" data-color="slate" onclick="selectColor('slate')"></button>
                            </div>
                            <div class="add-footer-buttons">
                                <button class="cancel-btn" onclick="cancelEdit()">Cancel</button>
                                <button class="add-btn" id="addBtn" onclick="saveTask()">
                                    <span id="btnText">Add</span>
                                    <span class="add-icon" id="btnIcon">+</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="tasks-section">
                    <div class="tasks-header">
                        <span class="section-title">Schedule</span>
                        <span class="task-count" id="taskCount">0 tasks</span>
                    </div>
                    <div class="tasks-list" id="taskContainer"></div>
                </section>

                <section class="stats-section">
                    <div class="stats-header" onclick="toggleStats()">
                        <span class="section-title">Statistics</span>
                        <span class="stats-toggle" id="statsToggle">▼</span>
                    </div>
                    <div class="stats-list" id="statsContainer"></div>
                </section>
            </main>
        </div>

        <!-- TODO TAB -->
        <div id="todo-tab" class="tab-content hidden">
            <section class="add-card">
                <div class="add-header">
                    <span class="section-title">Add Todo</span>
                </div>

                <div class="add-body">
                    <input
                        type="text"
                        class="task-input"
                        id="todoInput"
                        placeholder="What needs to be done?"
                    >

                    <div class="add-footer">
                        <div class="priority-options">
                            <button class="priority-btn" data-priority="high" onclick="selectPriority('high')">High</button>
                            <button class="priority-btn active" data-priority="medium" onclick="selectPriority('medium')">Med</button>
                            <button class="priority-btn" data-priority="low" onclick="selectPriority('low')">Low</button>
                        </div>
                        <div class="add-footer-buttons">
                            <button class="cancel-btn todo-cancel-btn" onclick="cancelTodoEdit()">Cancel</button>
                            <button class="add-btn" id="todoAddBtn" onclick="handleTodoSubmit()">
                                <span>Add</span>
                                <span class="add-icon">+</span>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="tasks-section">
                <div class="tasks-header">
                    <span class="section-title">Todos</span>
                    <span class="task-count" id="todoProgress">0 todos</span>
                </div>
                <div class="tasks-list" id="todoContainer"></div>
            </section>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="auth-modal" id="authModal">
        <div class="auth-card">
            <div class="auth-header">
                <span>Sync Across Devices</span>
                <button class="menu-close-btn" onclick="hideAuthModal()">×</button>
            </div>
            <div class="auth-body" id="authBody">
                <div class="auth-logged-out" id="authLoggedOut">
                    <p class="auth-desc">Sign in to sync your schedules across all your devices.</p>
                    <input type="email" id="authEmail" placeholder="Email" class="auth-input">
                    <input type="password" id="authPassword" placeholder="Password" class="auth-input">
                    <button class="auth-submit-btn" onclick="signInWithEmail()">Sign In</button>
                    <button class="auth-link-btn" onclick="signUpWithEmail()">Create Account</button>
                </div>
                <div class="auth-logged-in" id="authLoggedIn" style="display:none;">
                    <p class="auth-user" id="authUser"></p>
                    <button class="auth-submit-btn" onclick="syncNow()">Sync Now</button>
                    <button class="auth-link-btn auth-signout" onclick="signOut()">Sign Out</button>
                </div>
            </div>
        </div>
    </div>
    <div class="auth-overlay" id="authOverlay" onclick="hideAuthModal()"></div>

    <!-- Scripts (load order matters) -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/timetable.js"></script>
    <script src="js/todo.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
