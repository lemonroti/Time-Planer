<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .date-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .date-nav button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.3s;
        }

        .date-nav button:hover {
            background: rgba(255,255,255,0.3);
        }

        .date-nav .current-date {
            font-size: 1.1rem;
            font-weight: 500;
            min-width: 200px;
            text-align: center;
        }

        /* Add Task Section */
        .add-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .add-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .add-section h3 {
            color: #333;
        }

        .hours-left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .add-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .time-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .time-inputs input[type="time"] {
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            width: 120px;
        }

        .time-inputs span {
            color: #666;
        }

        .task-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
        }

        .task-input:focus, .time-inputs input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        /* Color picker */
        .color-picker {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s;
        }

        .color-dot:hover {
            transform: scale(1.1);
        }

        .color-dot.selected {
            border-color: #333;
        }

        .color-purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .color-blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .color-green { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .color-orange { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .color-red { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }

        /* Task List */
        .task-list {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .task-list-header {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-list-header h3 {
            color: #333;
        }

        .task-count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .tasks {
            max-height: 500px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            gap: 12px;
            transition: background 0.2s;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item:hover {
            background: #f8f9ff;
        }

        .task-color-bar {
            width: 4px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .task-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-time-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-time {
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
        }

        .task-time .end-time {
            color: #999;
        }

        .task-duration {
            background: #f0f0f0;
            color: #666;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .task-content {
            font-size: 1rem;
            color: #333;
            line-height: 1.4;
            word-break: break-word;
        }

        .task-item.completed .task-content {
            text-decoration: line-through;
            color: #999;
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .btn-complete, .btn-delete {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .btn-complete {
            background: #e8f5e9;
            color: #4caf50;
        }

        .btn-complete:hover {
            transform: scale(1.1);
            background: #c8e6c9;
        }

        .task-item.completed .btn-complete {
            background: #4caf50;
            color: white;
        }

        .btn-delete {
            background: #ffebee;
            color: #f44336;
        }

        .btn-delete:hover {
            transform: scale(1.1);
            background: #ffcdd2;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .add-form {
                flex-direction: column;
            }

            .time-inputs {
                width: 100%;
                justify-content: center;
            }

            .task-input {
                width: 100%;
            }

            .btn-add {
                width: 100%;
            }

            .color-picker {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Time Planner</h1>
            <div class="date-nav">
                <button onclick="changeDate(-1)">&lt;</button>
                <span class="current-date" id="currentDate"></span>
                <button onclick="changeDate(1)">&gt;</button>
            </div>
        </header>

        <div class="add-section">
            <div class="add-section-header">
                <h3>Add New Task</h3>
                <span class="hours-left" id="hoursLeft">24 hrs left</span>
            </div>
            <div class="add-form">
                <div class="time-inputs">
                    <input type="time" id="startTime" value="09:00">
                    <span>to</span>
                    <input type="time" id="endTime" value="10:00">
                </div>
                <input type="text" class="task-input" id="taskInput" placeholder="What do you want to do?">
                <div class="color-picker">
                    <div class="color-dot color-purple selected" data-color="purple" onclick="selectColor('purple')"></div>
                    <div class="color-dot color-blue" data-color="blue" onclick="selectColor('blue')"></div>
                    <div class="color-dot color-green" data-color="green" onclick="selectColor('green')"></div>
                    <div class="color-dot color-orange" data-color="orange" onclick="selectColor('orange')"></div>
                    <div class="color-dot color-red" data-color="red" onclick="selectColor('red')"></div>
                </div>
                <button class="btn-add" onclick="addTask()">Add</button>
            </div>
        </div>

        <div class="task-list">
            <div class="task-list-header">
                <h3>Today's Schedule</h3>
                <span class="task-count" id="taskCount">0 tasks</span>
            </div>
            <div class="tasks" id="taskContainer"></div>
        </div>
    </div>

    <script>
        // State
        let currentDate = new Date();
        let selectedColor = 'purple';

        // Color gradients
        const colorGradients = {
            purple: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            blue: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            green: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            orange: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            red: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)'
        };

        // Get date key for storage
        function getDateKey(date) {
            return date.toISOString().split('T')[0];
        }

        // Load data from localStorage
        function loadData() {
            const key = getDateKey(currentDate);
            const data = localStorage.getItem('timeplanner_' + key);
            return data ? JSON.parse(data) : [];
        }

        // Save data to localStorage
        function saveData(data) {
            const key = getDateKey(currentDate);
            localStorage.setItem('timeplanner_' + key, JSON.stringify(data));
        }

        // Format date for display
        function formatDate(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        // Format time for display
        function formatTime(time) {
            const [hours, minutes] = time.split(':');
            const h = parseInt(hours);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const hour12 = h % 12 || 12;
            return `${hour12}:${minutes} ${ampm}`;
        }

        // Calculate duration in hours between two times
        function calcDuration(startTime, endTime) {
            const [startH, startM] = startTime.split(':').map(Number);
            const [endH, endM] = endTime.split(':').map(Number);
            const startMins = startH * 60 + startM;
            const endMins = endH * 60 + endM;
            const diffMins = endMins - startMins;
            return diffMins / 60;
        }

        // Format duration for display
        function formatDuration(hours) {
            if (hours <= 0) return '0 hrs';
            if (hours < 1) return `${Math.round(hours * 60)} min`;
            if (hours === 1) return '1 hr';
            if (Number.isInteger(hours)) return `${hours} hrs`;
            return `${hours.toFixed(1)} hrs`;
        }

        // Calculate total allocated hours
        function calcTotalAllocated(tasks) {
            return tasks.reduce((total, task) => {
                const dur = calcDuration(task.startTime, task.endTime);
                return total + (dur > 0 ? dur : 0);
            }, 0);
        }

        // Update hours left display
        function updateHoursLeft() {
            const tasks = loadData();
            const allocated = calcTotalAllocated(tasks);
            const left = 24 - allocated;
            document.getElementById('hoursLeft').textContent = `${formatDuration(left > 0 ? left : 0)} left`;
        }

        // Change date
        function changeDate(delta) {
            currentDate.setDate(currentDate.getDate() + delta);
            updateDateDisplay();
            renderTasks();
        }

        // Update date display
        function updateDateDisplay() {
            document.getElementById('currentDate').textContent = formatDate(currentDate);
        }

        // Select color
        function selectColor(color) {
            selectedColor = color;
            document.querySelectorAll('.color-dot').forEach(el => {
                el.classList.toggle('selected', el.dataset.color === color);
            });
        }

        // Add task
        function addTask() {
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const taskText = document.getElementById('taskInput').value.trim();

            if (!taskText) {
                document.getElementById('taskInput').focus();
                return;
            }

            const tasks = loadData();
            tasks.push({
                id: Date.now(),
                startTime,
                endTime,
                text: taskText,
                color: selectedColor,
                completed: false
            });

            // Sort by start time
            tasks.sort((a, b) => a.startTime.localeCompare(b.startTime));

            saveData(tasks);
            renderTasks();

            // Clear input
            document.getElementById('taskInput').value = '';
            document.getElementById('taskInput').focus();
        }

        // Toggle task completion
        function toggleTask(id) {
            const tasks = loadData();
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveData(tasks);
                renderTasks();
            }
        }

        // Delete task
        function deleteTask(id) {
            let tasks = loadData();
            tasks = tasks.filter(t => t.id !== id);
            saveData(tasks);
            renderTasks();
        }

        // Render tasks
        function renderTasks() {
            const container = document.getElementById('taskContainer');
            const tasks = loadData();

            document.getElementById('taskCount').textContent = `${tasks.length} task${tasks.length !== 1 ? 's' : ''}`;

            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📅</div>
                        <p>No tasks for this day</p>
                        <p>Add your first task above!</p>
                    </div>
                `;
                updateHoursLeft();
                return;
            }

            container.innerHTML = tasks.map(task => {
                const duration = calcDuration(task.startTime, task.endTime);
                return `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="task-color-bar" style="background: ${colorGradients[task.color]}"></div>
                    <div class="task-main">
                        <div class="task-time-row">
                            <div class="task-time">
                                ${formatTime(task.startTime)}
                                <span class="end-time">- ${formatTime(task.endTime)}</span>
                            </div>
                            <span class="task-duration">${formatDuration(duration)}</span>
                        </div>
                        <div class="task-content">${task.text}</div>
                    </div>
                    <div class="task-actions">
                        <button class="btn-complete" onclick="toggleTask(${task.id})">✓</button>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">×</button>
                    </div>
                </div>
            `}).join('');

            updateHoursLeft();
        }

        // Keyboard shortcut
        document.getElementById('taskInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Initialize
        updateDateDisplay();
        renderTasks();
        updateHoursLeft();
    </script>
</body>
</html>
